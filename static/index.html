<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bulut – Kod Asistanı</title>
<link rel="icon" href="/bulut.png">
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --border: #e3e2dc; --accent: #2f6fde; --user: #eef3fd; --code: #f1f0ec; --err: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a; --panel: #1f1f23; --text: #e8e8e6; --muted: #9a9a95;
      --border: #303036; --accent: #6b9cff; --user: #24304a; --code: #121215; --err: #ff6b5e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 16px;
           border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; margin-right: auto; }
  select, button { font: inherit; color: var(--text); background: var(--panel);
                   border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  #status { font-size: 13px; color: var(--muted); width: 100%; }
  #status.err { color: var(--err); }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  .wrap { max-width: 860px; margin: 0 auto; }
  .msg { padding: 12px 14px; border-radius: 12px; margin: 10px 0; background: var(--panel);
         border: 1px solid var(--border); overflow-wrap: anywhere; }
  .msg.user { background: var(--user); white-space: pre-wrap; }
  .msg p { margin: 0.4em 0; }
  .msg code { background: var(--code); padding: 1px 5px; border-radius: 4px;
              font: 13px ui-monospace, "Cascadia Code", Consolas, monospace; }
  .block { margin: 10px 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .block .bar { display: flex; gap: 6px; align-items: center; padding: 4px 8px;
                background: var(--code); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); }
  .block .bar span { margin-right: auto; }
  .block .bar button { padding: 2px 8px; font-size: 12px; }
  .block pre { margin: 0; padding: 10px; overflow-x: auto; background: var(--code); }
  .block pre code { background: none; padding: 0; }
  .out { margin: 0; padding: 8px 10px; font: 12.5px ui-monospace, Consolas, monospace;
         white-space: pre-wrap; border-top: 1px dashed var(--border); }
  .out.bad { color: var(--err); }
  .empty { color: var(--muted); text-align: center; margin-top: 12vh; }
  .empty b { color: var(--text); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }
  .chips button { font-size: 13px; }
  footer { border-top: 1px solid var(--border); background: var(--panel); padding: 12px 16px; }
  form { max-width: 860px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; resize: none; min-height: 44px; max-height: 240px; padding: 10px 12px;
             font: inherit; color: var(--text); background: var(--bg);
             border: 1px solid var(--border); border-radius: 10px; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #send { background: var(--accent); color: #fff; border: none; padding: 10px 18px; }
  #file { display: none; }
  #projBtn.on { border-color: var(--accent); color: var(--accent); }
  #projPanel { display: none; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
  #projPanel.open { display: block; }
  #projPanel .row { max-width: 860px; margin: 0 auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #projPath { flex: 1; min-width: 220px; padding: 7px 10px; font: inherit; color: var(--text);
              background: var(--bg); border: 1px solid var(--border); border-radius: 8px; }
  #projInfo { max-width: 860px; margin: 8px auto 0; font-size: 13px; color: var(--muted); }
  .files { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .files code { font-size: 11.5px; }
  form { position: relative; }
  #mention { position: absolute; bottom: 100%; left: 48px; right: 90px; margin-bottom: 6px; display: none;
             background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
             box-shadow: 0 4px 16px rgba(0,0,0,.12); max-height: 240px; overflow-y: auto; }
  #mention div { padding: 6px 10px; font: 13px ui-monospace, Consolas, monospace; cursor: pointer; }
  #mention div.sel, #mention div:hover { background: var(--user); }
  .block .bar .path { color: var(--text); font-family: ui-monospace, Consolas, monospace; }
  .block .bar button.apply { border-color: var(--accent); color: var(--accent); }
  .block .bar button.done { border-color: #2e9e5b; color: #2e9e5b; }
  .streaming [data-act=apply], .streaming [data-act=applyas] { display: none; }
  #undoBtn { display: none; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center;
           justify-content: center; padding: 16px; z-index: 10; }
  #modal.open { display: flex; }
  #modal .box { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; width: 100%;
                max-width: 960px; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
  #modal h2 { font-size: 15px; margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  #modal .warn { margin: 10px 16px 0; padding: 8px 10px; border-radius: 8px; font-size: 13px;
                 background: rgba(192,57,43,.1); color: var(--err); }
  #modal .diff { margin: 10px 16px; overflow: auto; flex: 1; background: var(--code); border-radius: 8px;
                 font: 12.5px/1.45 ui-monospace, Consolas, monospace; padding: 8px 0; white-space: pre; }
  #modal .diff div { padding: 0 10px; }
  #modal .diff .add { background: rgba(46,158,91,.18); }
  #modal .diff .del { background: rgba(192,57,43,.16); }
  #modal .diff .hunk { color: var(--accent); }
  #modal .actions { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px; border-top: 1px solid var(--border); }
  #modal .actions .primary { background: var(--accent); color: #fff; border: none; }
  #toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--text);
           color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; display: none; z-index: 11; }
</style>
</head>
<body>
<header>
  <h1>☁️ Bulut</h1>
  <button id="projBtn" type="button" title="Proje klasörü aç">📁 Proje</button>
  <select id="model" title="Model"></select>
  <button id="undoBtn" type="button" title="Son dosya değişikliğini geri al">↶ Geri al</button>
  <button id="new" type="button">Yeni sohbet</button>
  <button id="quit" type="button" title="Bulut'u kapat">⏻</button>
  <div id="status"></div>
</header>

<div id="projPanel">
  <div class="row">
    <input id="projPath" placeholder="Proje klasörünün tam yolu, örn. C:\xampp\htdocs\sitem veya /home/ben/projem">
    <button id="projOpen" type="button">Aç</button>
    <button id="projClose" type="button">Kapat</button>
  </div>
  <div id="projInfo">Bir klasör açınca Bulut her soruda ilgili dosyaları bulup okur. Belirli bir dosyayı eklemek için mesajda <code>@</code> yaz.</div>
</div>

<main id="chat"><div class="wrap" id="log"></div></main>

<footer>
  <form id="form">
    <div id="mention"></div>
    <button type="button" onclick="document.getElementById('file').click()" title="Dosya ekle">📎</button>
    <input type="file" id="file" multiple>
    <textarea id="input" rows="1" placeholder="PHP, Java veya Python hakkında sor… (Enter gönder, Shift+Enter yeni satır)"></textarea>
    <button id="send" type="submit">Gönder</button>
  </form>
</footer>

<div id="modal"><div class="box">
  <h2 id="mTitle"></h2>
  <div id="mWarn"></div>
  <div class="diff" id="mDiff"></div>
  <div class="actions">
    <button type="button" id="mCancel">İptal</button>
    <button type="button" class="primary" id="mOk">Onayla ve dosyaya yaz</button>
  </div>
</div></div>
<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), input = $("input"), modelSel = $("model"), statusEl = $("status");
const RUNNABLE = { python: "python", py: "python", php: "php", java: "java" };
let messages = [];
let busy = false;
let attached = [];
let project = null, projectFiles = [];

try { messages = JSON.parse(localStorage.getItem("bulut_messages") || "[]"); } catch (e) {}
const save = () => { try { localStorage.setItem("bulut_messages", JSON.stringify(messages)); } catch (e) {} };

const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
}

// Küçük markdown çevirici: kod blokları, başlıklar, listeler, paragraflar.
function render(md) {
  const parts = md.split(/```/);
  let html = "";
  parts.forEach((part, i) => {
    if (i % 2 === 1) {
      const nl = part.indexOf("\n");
      const info = (nl === -1 ? "" : part.slice(0, nl)).trim();
      const m = info.match(/^([\w+#-]*)[ :](\S+)$/);
      const lang = (m ? m[1] : info).toLowerCase();
      const path = m ? m[2].replace(/^\.?\//, "") : "";
      const code = nl === -1 ? part : part.slice(nl + 1);
      const isEdit = /^<{5,9} ?ARA/m.test(code);
      const runBtn = RUNNABLE[lang] && !isEdit ? `<button data-act="run" data-lang="${RUNNABLE[lang]}">▶ Çalıştır</button>` : "";
      const applyBtn = !project ? "" : path
        ? `<button class="apply" data-act="apply" data-path="${esc(path)}">💾 Uygula</button>`
        : (lang && lang !== "bash" && lang !== "sh" && lang !== "text" ? `<button data-act="applyas">💾 Dosyaya yaz…</button>` : "");
      const label = path ? `<span class="path">${esc(path)}</span>` : `<span>${esc(lang || "kod")}</span>`;
      html += `<div class="block"><div class="bar">${label}${applyBtn}${runBtn}` +
              `<button data-act="copy">Kopyala</button></div><pre><code>${esc(code.replace(/\n$/, ""))}</code></pre></div>`;
    } else {
      part.split(/\n{2,}/).forEach((para) => {
        if (!para.trim()) return;
        const lines = para.split("\n");
        if (lines.every((l) => /^\s*([-*]|\d+\.)\s/.test(l) || !l.trim())) {
          html += "<ul>" + lines.filter((l) => l.trim())
            .map((l) => "<li>" + inline(l.replace(/^\s*([-*]|\d+\.)\s/, "")) + "</li>").join("") + "</ul>";
        } else if (/^#{1,6}\s/.test(para)) {
          html += "<p><b>" + inline(para.replace(/^#+\s/, "")) + "</b></p>";
        } else {
          html += "<p>" + lines.map(inline).join("<br>") + "</p>";
        }
      });
    }
  });
  return html;
}

function filesHtml(files) {
  if (!files || !files.length) return "";
  const shown = files.slice(0, 12).map((f) => `<code>${esc(f)}</code>`).join(" ");
  return `<div class="files">📄 İncelenen dosyalar: ${shown}${files.length > 12 ? ` +${files.length - 12}` : ""}</div>`;
}

function addMsg(role, text, files) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  if (role === "user") el.textContent = text; else el.innerHTML = filesHtml(files) + render(text);
  log.appendChild(el);
  scroll();
  return el;
}

function scroll() { $("chat").scrollTop = $("chat").scrollHeight; }

function showEmpty() {
  log.innerHTML = `<div class="empty"><p><b>Merhaba, ben Bulut.</b><br>Bilgisayarında çalışan PHP · Java · Python asistanınım.</p>
    <div class="chips">
      <button data-q="PHP'de PDO ile güvenli bir kullanıcı giriş (login) örneği yaz.">PHP PDO login</button>
      <button data-q="Java'da bir listeyi stream API ile filtreleyip gruplayan örnek yaz.">Java Stream API</button>
      <button data-q="Python'da FastAPI ile basit bir REST API (CRUD) yaz.">Python FastAPI CRUD</button>
      <button data-q="Bu üç dilde (PHP, Java, Python) bir dosyayı satır satır okuyan kodu karşılaştır.">3 dil karşılaştır</button>
    </div>${project ? `<p style="margin-top:20px">📁 Açık proje: <b>${esc(project.name)}</b></p><div class="chips">
      <button data-q="Bu projenin yapısını özetle: ne yapıyor, hangi teknolojiler var, ana klasörler ne işe yarıyor?">Projeyi özetle</button>
      <button data-q="Bu projedeki olası hataları ve güvenlik açıklarını (SQL injection, XSS, doğrulanmayan girdi vb.) bul.">Hata / güvenlik taraması</button>
      <button data-q="Bu projenin kod kalitesini değerlendir ve en önemli 5 iyileştirmeyi öner.">İyileştirme önerileri</button>
    </div>` : ""}</div>`;
}

function redraw() {
  log.innerHTML = "";
  if (!messages.length) return showEmpty();
  messages.forEach((m) => addMsg(m.role, m.content, m.files));
}

async function loadModels() {
  try {
    const r = await (await fetch("/api/models")).json();
    const list = r.models.length ? r.models : [r.default];
    modelSel.innerHTML = list.map((m) => `<option>${esc(m)}</option>`).join("");
    const saved = localStorage.getItem("bulut_model");
    modelSel.value = list.includes(saved) ? saved : (list.includes(r.default) ? r.default : list[0]);
    if (r.error) setStatus(r.error, true);
    else if (!r.models.includes(modelSel.value)) setStatus(`Model yüklü değil. Terminalde çalıştır: ollama pull ${r.default}`, true);
  } catch (e) { setStatus("Sunucuya bağlanılamadı.", true); }
}

function setStatus(t, err) { statusEl.textContent = t || ""; statusEl.className = err ? "err" : ""; }

async function send(text) {
  if (busy || !text.trim()) return;
  if (!messages.length) log.innerHTML = "";
  let content = text;
  if (attached.length) {
    content = attached.map((f) => `Dosya: ${f.name}\n\`\`\`\n${f.text}\n\`\`\``).join("\n\n") + "\n\n" + text;
    attached = []; setStatus("");
  }
  messages.push({ role: "user", content });
  addMsg("user", content);
  input.value = ""; resize();
  busy = true; $("send").textContent = "…";
  const el = addMsg("assistant", "");
  el.classList.add("streaming");
  let answer = "", used = [];
  if (project) el.innerHTML = '<p class="files">📁 Proje taranıyor…</p>';
  try {
    const res = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: modelSel.value, messages: messages.map(({ role, content }) => ({ role, content })) }),
    });
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n"); buf = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const j = JSON.parse(line);
        if (j.error) throw new Error(j.error);
        if (j.files) { used = j.files; el.innerHTML = filesHtml(used); continue; }
        answer += j.t; el.innerHTML = filesHtml(used) + render(answer); scroll();
      }
    }
    messages.push({ role: "assistant", content: answer, files: used });
    save();
  } catch (e) {
    messages.pop();
    el.innerHTML = `<p style="color:var(--err)">Hata: ${esc(e.message)}</p>`;
  } finally {
    busy = false; $("send").textContent = "Gönder"; input.focus();
    el.classList.remove("streaming");
  }
}

log.addEventListener("click", async (e) => {
  const q = e.target.dataset.q;
  if (q) return send(q);
  const act = e.target.dataset.act;
  if (!act) return;
  const block = e.target.closest(".block");
  const code = block.querySelector("pre").innerText;
  if (act === "apply" || act === "applyas") {
    let path = e.target.dataset.path;
    if (act === "applyas") {
      path = prompt("Proje içinde hangi dosyaya yazılsın? (örn. app/Models/User.php)");
      if (!path) return;
    }
    return previewApply(path, code, e.target);
  }
  if (act === "copy") {
    await navigator.clipboard.writeText(code);
    e.target.textContent = "Kopyalandı ✓"; setTimeout(() => (e.target.textContent = "Kopyala"), 1500);
  } else if (act === "run") {
    let out = block.querySelector(".out");
    if (!out) { out = document.createElement("pre"); out.className = "out"; block.appendChild(out); }
    out.className = "out"; out.textContent = "Çalışıyor…";
    try {
      const r = await (await fetch("/api/run", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ language: e.target.dataset.lang, code }),
      })).json();
      out.textContent = r.output || r.error; if (!r.ok) out.className = "out bad";
    } catch (err) { out.textContent = "Çalıştırılamadı: " + err.message; out.className = "out bad"; }
  }
});

$("file").addEventListener("change", async (e) => {
  for (const f of e.target.files) {
    if (f.size > 200000) { setStatus(`${f.name} çok büyük (200 KB sınırı).`, true); continue; }
    attached.push({ name: f.name, text: await f.text() });
  }
  e.target.value = "";
  if (attached.length) setStatus("Eklenen dosyalar: " + attached.map((f) => f.name).join(", "));
});

function resize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 240) + "px"; }
input.addEventListener("input", resize);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(input.value); }
});
$("form").addEventListener("submit", (e) => { e.preventDefault(); send(input.value); });
$("new").addEventListener("click", () => { messages = []; save(); redraw(); });
modelSel.addEventListener("change", () => { try { localStorage.setItem("bulut_model", modelSel.value); } catch (e) {} });

// ---------------------------------------------------------------- proje
function showProject(p) {
  project = p;
  $("projBtn").classList.toggle("on", !!p);
  $("projBtn").textContent = p ? "📁 " + p.name : "📁 Proje";
  if (p) {
    $("projPath").value = p.root;
    $("projInfo").innerHTML = `<b>${esc(p.name)}</b> açık — ${p.files} dosya` +
      (p.stack.length ? ` · ${esc(p.stack.join(", "))}` : "") +
      (p.truncated ? " · <span style='color:var(--err)'>çok büyük, bir kısmı atlandı</span>" : "") +
      `. Mesajda <code>@</code> yazarak dosya seçebilirsin.`;
    fetch("/api/project/files").then((r) => r.json()).then((r) => (projectFiles = r.files));
  } else {
    projectFiles = [];
    $("projInfo").innerHTML = "Bir klasör açınca Bulut her soruda ilgili dosyaları bulup okur.";
  }
  setUndo(0);
  redraw();
}

async function openProject(path) {
  $("projInfo").textContent = path ? "Taranıyor…" : "";
  const r = await (await fetch("/api/project", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ path }),
  })).json();
  if (r.error) { $("projInfo").innerHTML = `<span style="color:var(--err)">${esc(r.error)}</span>`; return; }
  showProject(r.project);
  try { localStorage.setItem("bulut_project", path || ""); } catch (e) {}
  if (r.project) $("projPanel").classList.remove("open");
}

$("projBtn").addEventListener("click", () => { $("projPanel").classList.toggle("open"); $("projPath").focus(); });
$("projOpen").addEventListener("click", () => openProject($("projPath").value.trim()));
$("projPath").addEventListener("keydown", (e) => { if (e.key === "Enter") openProject($("projPath").value.trim()); });
$("projClose").addEventListener("click", () => { $("projPath").value = ""; openProject(""); });

async function initProject() {
  try {
    const r = await (await fetch("/api/project")).json();
    if (r.project) return showProject(r.project);
    const last = localStorage.getItem("bulut_project");
    if (last) { $("projPath").value = last; openProject(last); }
  } catch (e) {}
}

// ---------------------------------------------------------------- dosyaya uygulama
let pending = null;

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.h); toast.h = setTimeout(() => (t.style.display = "none"), 3500);
}

async function post(url, body) {
  return (await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
                             body: JSON.stringify(body || {}) })).json();
}

async function previewApply(path, content, btn) {
  const r = await post("/api/project/preview", { path, content });
  if (!r.ok) return alert("Uygulanamıyor:\n" + r.error);
  if (!r.changed) return toast(`${r.path} zaten aynı, değişiklik yok.`);
  pending = { path, content, btn };
  $("mTitle").textContent = (r.new_file ? "Yeni dosya oluşturulacak: " : "Değişiklik: ") + r.path;
  $("mWarn").innerHTML = r.warnings.map((w) => `<div class="warn">⚠️ ${esc(w)}</div>`).join("");
  $("mDiff").innerHTML = r.diff.split("\n").map((l) => {
    const c = l.startsWith("+++") || l.startsWith("---") ? "" : l[0] === "+" ? "add" : l[0] === "-" ? "del" : l.startsWith("@@") ? "hunk" : "";
    return `<div class="${c}">${esc(l) || " "}</div>`;
  }).join("");
  $("modal").classList.add("open");
  $("mOk").focus();
}

function closeModal() { $("modal").classList.remove("open"); pending = null; }
$("mCancel").addEventListener("click", closeModal);
$("modal").addEventListener("click", (e) => { if (e.target.id === "modal") closeModal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && pending) closeModal(); });

$("mOk").addEventListener("click", async () => {
  if (!pending) return;
  const { path, content, btn } = pending;
  const r = await post("/api/project/apply", { path, content });
  closeModal();
  if (!r.ok) return alert("Yazılamadı:\n" + r.error);
  btn.textContent = "✓ Uygulandı"; btn.classList.add("done");
  setUndo(r.undo_count);
  toast(`${r.path} ${r.new_file ? "oluşturuldu" : "güncellendi"}.`);
  fetch("/api/project/files").then((x) => x.json()).then((x) => (projectFiles = x.files));
});

function setUndo(n) { $("undoBtn").style.display = n ? "inline-block" : "none"; }
$("undoBtn").addEventListener("click", async () => {
  const r = await post("/api/project/undo");
  toast(r.message || r.error);
  setUndo(r.undo_count);
});

// ---------------------------------------------------------------- @dosya önerisi
const mention = $("mention");
let mItems = [], mSel = 0;

function mentionQuery() {
  const before = input.value.slice(0, input.selectionStart);
  const m = before.match(/@([\w./\\-]*)$/);
  return m ? m[1] : null;
}

function updateMention() {
  const q = projectFiles.length ? mentionQuery() : null;
  if (q === null) { mention.style.display = "none"; mItems = []; return; }
  const ql = q.toLowerCase();
  mItems = projectFiles.filter((f) => f.toLowerCase().includes(ql))
    .sort((a, b) => a.split("/").pop().toLowerCase().startsWith(ql) ? -1 : b.split("/").pop().toLowerCase().startsWith(ql) ? 1 : a.length - b.length)
    .slice(0, 10);
  mSel = 0;
  mention.innerHTML = mItems.map((f, i) => `<div data-i="${i}" class="${i === 0 ? "sel" : ""}">${esc(f)}</div>`).join("");
  mention.style.display = mItems.length ? "block" : "none";
}

function pickMention(i) {
  const pos = input.selectionStart, before = input.value.slice(0, pos);
  const start = before.lastIndexOf("@");
  input.value = input.value.slice(0, start) + "@" + mItems[i] + " " + input.value.slice(pos);
  const c = start + mItems[i].length + 2;
  input.setSelectionRange(c, c);
  mention.style.display = "none"; mItems = [];
  input.focus(); resize();
}

input.addEventListener("input", updateMention);
input.addEventListener("click", updateMention);
mention.addEventListener("mousedown", (e) => { e.preventDefault(); if (e.target.dataset.i) pickMention(+e.target.dataset.i); });
input.addEventListener("keydown", (e) => {
  if (!mItems.length || mention.style.display === "none") return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    mSel = (mSel + (e.key === "ArrowDown" ? 1 : mItems.length - 1)) % mItems.length;
    [...mention.children].forEach((d, i) => d.classList.toggle("sel", i === mSel));
  } else if (e.key === "Enter" || e.key === "Tab") {
    e.preventDefault(); e.stopImmediatePropagation(); pickMention(mSel);
  } else if (e.key === "Escape") { mention.style.display = "none"; mItems = []; }
}, true);

$("quit").addEventListener("click", async () => {
  if (!confirm("Bulut kapatılsın mı? (Tekrar açmak için masaüstündeki Bulut simgesine tıkla.)")) return;
  try { await post("/api/kapat"); } catch (e) {}
  document.body.innerHTML = '<p style="margin:20vh auto;text-align:center;color:var(--muted)">Bulut kapatıldı. Bu sekmeyi kapatabilirsin.</p>';
});

redraw();
loadModels();
initProject();
input.focus();
</script>
